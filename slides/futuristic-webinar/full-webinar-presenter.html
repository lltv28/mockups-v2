<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kodara presenter</title><link rel="icon" href="/mockups-v2/slides/futuristic-webinar/brand/favicon-192.png">  <script type="module" crossorigin src="/mockups-v2/slides/futuristic-webinar/assets/presenter-BDPYBVIF.js"></script>
  <link rel="modulepreload" crossorigin href="/mockups-v2/slides/futuristic-webinar/assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="stylesheet" crossorigin href="/mockups-v2/slides/futuristic-webinar/assets/presenter-B7wf2NxI.css">
</head>
<body><div class="presenter">
<header class="topbar"><strong>Kodara · Presenter</strong><output id="status" aria-live="polite">Waiting for audience deck…</output><div class="session"><span>Position <output id="position">—</output></span><span>Elapsed <output id="elapsed">00:00</output></span></div></header>
<main class="workspace">
<section class="preview-card current-card"><h2>Current slide</h2><div class="preview-shell"><iframe id="current-preview" title="Current slide preview" tabindex="-1"></iframe></div></section>
<div class="side"><section class="preview-card next-card"><h2>Next slide</h2><div class="preview-shell"><iframe id="next-preview" title="Next slide preview" tabindex="-1"></iframe><p id="end" hidden>End of presentation</p></div></section>
<section class="notes"><label for="notes">Speaker notes <span id="save-status">Private to this browser</span></label><textarea id="notes" spellcheck="true" disabled></textarea><details><summary id="source-label">Original speaker script</summary><pre id="source-notes"></pre></details></section></div>
</main><footer><p>Keep this window off the shared display. Share only the audience deck.</p><nav><button id="previous" disabled>← Previous</button><button id="next" disabled>Next →</button></nav></footer>
</div></body></html>
